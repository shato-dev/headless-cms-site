# Runs on GitHub's servers for every push to main and every pull request.
# `build` checks that the site builds (PRs and main). `deploy` publishes the
# built site to Cloudflare Workers (static assets) and runs on main only.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24 # matches the local dev version
          cache: npm

      # `npm ci` installs strictly from package-lock.json (reproducible),
      # unlike `npm install` which may update the lockfile.
      - run: npm ci

      # The actual check: the site must build without errors. The build
      # fetches content from microCMS (see src/lib/microcms-loader.ts), so
      # it needs these as repo secrets (Settings > Secrets and variables >
      # Actions), matching the local .env keys.
      - run: npm run build
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}

      # Hand the built site to the deploy job. Jobs run on separate machines,
      # so files have to be passed explicitly as an artifact. This way the
      # exact output that passed the check is what gets published.
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  deploy:
    needs: build
    # Never on pull requests: they must not get access to the Cloudflare token.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deploy at a time; a newer push waits instead of racing the running one.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Needed only to get the pinned `wrangler` (Cloudflare's CLI) from
      # package-lock.json.
      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # Uploads ./dist as configured in wrangler.jsonc. The API token and
      # account ID make it non-interactive (no `wrangler login`, no prompts).
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
